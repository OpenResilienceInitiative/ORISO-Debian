apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oriso-mariadb-client-ingress
  annotations:
    # SSL/TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Force cert-manager HTTP-01 solver to use the nginx ingress controller.
    # Otherwise the challenge may be created for a different ingress class and never be served.
    acme.cert-manager.io/http01-ingress-class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Basic auth (prevents public access to the DB UI)
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "oriso-mariadb-client-basic-auth"
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - ORISO DB"

    # Avoid accidental uploads/imports of huge files via UI
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  rules:
    - host: db.oriso-dev.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oriso-mariadb-client
                port:
                  number: 80
  tls:
    - hosts:
        - db.oriso-dev.site
      secretName: db-oriso-dev-site-tls


